# Set an absolute writable container; create staging, ocfl and ocfl-work below it.
# Only ocfl is the OCFL root. ocfl-work must share its volume.
resourceRoot=C:/path/to/deposit-resources
# Separate writable temporary export root; never inside resource/database directories.
exportRoot=C:/path/to/deposit-exports
# Use Configure-DepositDownloads.ps1 to allocate and persist a dedicated loopback port.
download.listenAddress=127.0.0.1
download.port=17771
download.publicBaseUrl=http://127.0.0.1:17771
# Remote direct TLS installations must set both protected values and use an HTTPS base URL.
# download.tlsKeyStore=C:/path/to/private/downloads.p12
# download.tlsKeyStorePasswordFile=C:/path/to/private/downloads-password.txt

# Required protected directory for Deposit bootstrap and cursor secrets. The
# launcher configures this outside Neo4j conf and grants the service identity access.
secretRoot=C:/path/to/neo4j/deposit-secrets
