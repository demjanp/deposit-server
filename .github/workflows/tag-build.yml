name: Tagged Deposit Server build

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out tagged server with full Git history
        uses: actions/checkout@v4
        with:
          path: deposit-server
          fetch-depth: 0

      - name: Check out authoritative Deposit Hub
        uses: actions/checkout@v4
        with:
          repository: demjanp/deposit-hub
          ref: main
          path: deposit-hub
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify pushed tag and build release package
        working-directory: deposit-server
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedTag = $env:GITHUB_REF_NAME
          if ($expectedTag -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$') { throw "Unsupported version tag: $expectedTag" }
          $versionTags = @(git tag --points-at HEAD | Where-Object { $_ -match '^\d+\.\d+\.\d+(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$' })
          if ($versionTags.Count -ne 1 -or $versionTags[0] -cne $expectedTag) { throw 'The pushed tag must be the only accepted version tag at HEAD' }
          if (git status --porcelain --untracked-files=all) { throw 'Tagged release checkout must be clean' }
          .\scripts\Invoke-IntegrationSuite.ps1 -SetupOnly

      - name: Upload versioned release package
        uses: actions/upload-artifact@v4
        with:
          name: deposit-server-${{ github.ref_name }}
          path: test_harness/build/deposit-server-${{ github.ref_name }}.zip
          if-no-files-found: error
          compression-level: 0
